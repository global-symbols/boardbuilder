<app-loading-notice class="mt-3" subject="Board Set" i18n-subject="board set|Board Set" *ngIf="loading"></app-loading-notice>
<app-error-not-found class="container mt-3" subject="Board Set" i18n-subject="board set|Board Set" *ngIf="loadingError"></app-error-not-found>
<div class="example-container" [class.example-is-mobile]="boardTreeMobileQuery.matches" *ngIf="boardSet">

  <mat-sidenav-container class="example-sidenav-container" [autosize]="true">
    <mat-sidenav #sideNav [mode]="boardTreeMobileQuery.matches ? 'over' : 'side'"
                 [fixedInViewport]="boardTreeMobileQuery.matches" fixedTopGap="56"
                 [opened]="!boardTreeMobileQuery.matches" id="leftSidebar"

    >
      <div fxLayout="column" fxFlex>
        <div id="leftSidebarHeaderPanel" class="mat-elevation-z4">


          <div fxLayout="row" fxLayoutAlign="space-between center" (dblclick)="editBoardSet()">
            <h3 id="boardSetName">{{boardSet.name}}</h3>

            <!-- Template i18n (not $localize) so the board-set tooltip keeps its existing translations. -->
            <button mat-button mat-icon-button *ngIf="!boardSet.isBook"
                    [matMenuTriggerFor]="matBoardSetMenu"
                    matTooltip="Board Set Actions" i18n-matTooltip="board set actions|Board Set Actions button" matTooltipPosition="right"
                    (click)="$event.stopPropagation()"
            >
              <mat-icon>more_vert</mat-icon>
            </button>
            <button mat-button mat-icon-button *ngIf="boardSet.isBook"
                    [matMenuTriggerFor]="matBoardSetMenu"
                    matTooltip="Book Actions" i18n-matTooltip="book actions|Book Actions button" matTooltipPosition="right"
                    (click)="$event.stopPropagation()"
            >
              <mat-icon>more_vert</mat-icon>
            </button>
          </div>

          <div fxLayout="row" fxLayoutAlign="space-between center" *ngIf="boardSet?.readonly">
            <div class="read-only" i18n="read only|Read Only indicator">Read Only</div>

            <button mat-button mat-icon-button (click)="copyBoardSet()"
                    matTooltip="Create Editable Copy" i18n-matTooltip="Board Set Create Editable Copy button" matTooltipPosition="right">
              <mat-icon>create</mat-icon>
            </button>
          </div>

        </div>

        <app-book-page-list *ngIf="boardSet.isBook"
                            [boardSet]="boardSet"
                            [boards]="boardSet.boards"
                            [selectedBoard]="board"
                            (selectionChange)="selectBoard($event)"
                            (deleteBoard)="deleteBoard($event)"
                            (duplicateBoard)="duplicateBoard($event)"
                            (translateBoard)="translateBoard($event)"
                            (updateBoard)="loadBoardSet()"
                            (boardAdded)="reloadAndSelect($event)"
                            (printPage)="printPage($event)"
                            (downloadBoard)="downloadBookPage($event)"
                            fxFlex="grow"
                            style="overflow-y: overlay"
        ></app-book-page-list>

        <app-board-tree *ngIf="!boardSet.isBook"
                        [boardSet]="boardSet"
                        [boards]="boardSet.boards"
                        [selectedBoard]="board"
                        (selectionChange)="selectBoard($event)"
                        (deleteBoard)="deleteBoard($event)"
                        (duplicateBoard)="duplicateBoard($event)"
                        (translateBoard)="translateBoard($event)"
                        (updateBoard)="loadBoardSet()"
                        fxFlex="grow"
                        style="overflow-y: overlay"
        >

        </app-board-tree>

        <div id="leftSidebarBottomPanel">
          <div *ngIf="!boardSet.isBook">
            <button mat-mini-fab
                    (click)="addBoard()"
                    [disabled]="boardSet?.readonly"
                    matTooltip="Add Board" i18n-matTooltip="add board|Add Board" matTooltipPosition="right"
                    aria-label="Add Board" i18n-aria-label="add board|Add Board"
                    color="primary" >
              <mat-icon>add</mat-icon>
            </button>
          </div>
          <div *ngIf="boardSet.isBook">
            <button mat-mini-fab class="add-page"
                    (click)="addBoard()"
                    [disabled]="boardSet?.readonly"
                    matTooltip="Add page" i18n-matTooltip="add page|Add page button in a book" matTooltipPosition="right"
                    aria-label="Add page" i18n-aria-label="add page|Add page button in a book"
                    color="primary" >
              <mat-icon>add</mat-icon>
            </button>
          </div>
        </div>
      </div>



    </mat-sidenav>

    <mat-sidenav [opened]="selectedCell" [mode]="cellEditorMobileQuery.matches ? 'over' : 'side'"
                 position="end" id="cellEditor" #cellEditor
                 (opened)="disableCellEditorAnimations = false"
                 (closed)="disableCellEditorAnimations = true"
                 (closedStart)="closeCellEditor()"
                 *ngIf="!boardSet?.readonly">

      <app-cell-editor [boardSet]="boardSet"
                       [board]="board"
                       [cell]="selectedCell"
                       (closed)="cellEditor.close();"
                       (cellLinkedToBoard)="refreshTree()"
                       [@.disabled]="disableCellEditorAnimations"
                       fxLayout="column" fxFlex
      ></app-cell-editor>
    </mat-sidenav>

    <mat-sidenav-content>
      <app-board-detail
        [board]="board"
        [boardSet]="boardSet"
        [cell]="selectedCell"
        [readonly]="boardSet.readonly"
        (boardChange)="selectBoard($event)"
        (cellChange)="selectCell($event)"
      ></app-board-detail>
    </mat-sidenav-content>
  </mat-sidenav-container>

  <div id="leftSidebarToggler" [class.open]="sideNav.opened">
    <button mat-mini-fab color="primary" (click)="sideNav.toggle()" [matTooltip]="(sideNav.opened ? 'Hide' : 'Show') + ' ' + ('boards' | term:boardSet) + ' Panel'" matTooltipPosition="right" class="mat-elevation-z2">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
</div>

<mat-menu #matBoardSetMenu="matMenu">
  <ng-container *ngIf="boardSet?.isBook">
    <button mat-menu-item class="print-book" (click)="printBook()">
      <mat-icon>print</mat-icon> <ng-container i18n="print book|Print book">Print book</ng-container>
    </button>
    <button mat-menu-item class="download-book" (click)="downloadBook()">
      <mat-icon>save_alt</mat-icon> <ng-container i18n="download book|Download book">Download book</ng-container>
    </button>
    <button mat-menu-item class="add-page-obf" (click)="bookPageInput.click()" [disabled]="boardSet?.readonly">
      <mat-icon>note_add</mat-icon> <ng-container i18n="add page from obf|Add page from OBF">Add page from OBF</ng-container>
    </button>
  </ng-container>
  <button mat-menu-item class="add-board-obf" (click)="uploadBoardObf()" [disabled]="boardSet?.readonly" *ngIf="!boardSet?.isBook">
    <mat-icon>note_add</mat-icon> <ng-container i18n="Add Board from OBF">Add Board from OBF</ng-container>
  </button>
  <button mat-menu-item class="download-obz" (click)="downloadBoardSetObz()" *ngIf="!boardSet?.isBook">
    <mat-icon>save_alt</mat-icon> <ng-container i18n="download obz|Download Board Set as OBZ">Download Board Set as OBZ</ng-container>
  </button>
  <button mat-menu-item (click)="translateBoardSet()">
    <mat-icon>translate</mat-icon>
    <ng-container i18n="translate|Translate">Translate</ng-container>
  </button>
  <button mat-menu-item (click)="copyBoardSet()">
    <mat-icon>content_copy</mat-icon>
    <ng-container *ngIf="!boardSet?.isBook" i18n="duplicate board set|Duplicate board set">Duplicate board set</ng-container>
    <ng-container *ngIf="boardSet?.isBook" i18n="duplicate book|Duplicate book">Duplicate book</ng-container>
  </button>
  <button mat-menu-item class="tab-printer-settings" (click)="openPrintableBook()" [disabled]="boardSet?.readonly" *ngIf="catalogueTabsEnabled && !boardSet?.isBook">
    <mat-icon>menu_book</mat-icon>
    <ng-container i18n="tab printer settings">Tab Printer Settings</ng-container>
  </button>
  <button mat-menu-item (click)="openTabs()" [disabled]="boardSet?.readonly" *ngIf="catalogueTabsEnabled && showTabSettingsMenu && !boardSet?.isBook">
    <mat-icon>tab</mat-icon>
    <ng-container i18n="tab settings|Tab settings">Tab settings</ng-container>
  </button>

  <mat-divider></mat-divider>

  <!-- <button mat-menu-item [matMenuTriggerFor]="copyLink">
    <mat-icon>link</mat-icon>
    <ng-container>Copy link...</ng-container>
  </button> -->

  <mat-divider></mat-divider>

  <button mat-menu-item (click)="deleteBoardSet(boardSet)" [disabled]="boardSet?.readonly">
    <mat-icon>delete</mat-icon>
    <ng-container i18n="delete|Delete">Delete</ng-container>
  </button>

  <button mat-menu-item (click)="editBoardSet()" [disabled]="boardSet?.readonly">
    <mat-icon>edit</mat-icon>
    <ng-container i18n="properties|Properties">Properties</ng-container>
  </button>
</mat-menu>

<!-- Add page from OBF: a page or back page file downloaded from a book. -->
<input type="file" accept=".obf,application/json" style="display: none" #bookPageInput
       (change)="importBookPage($event.target.files[0]); $event.target.value = ''">

<hotkeys-cheatsheet title="Keyboard Shortcuts" i18n-title="keyboard shortcuts|Keyboard Shortcuts" ></hotkeys-cheatsheet>
