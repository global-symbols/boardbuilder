<header fxLayout="row" fxLayoutAlign="space-between center" class="mb-3">
  <h1 mat-dialog-title class="mb-0" i18n="print individual page|Print individual page">Print individual page</h1>
  <button mat-icon-button aria-label="Close" i18n-aria-label="close|Close" [mat-dialog-close]="undefined">
    <mat-icon>close</mat-icon>
  </button>
</header>

<div mat-dialog-content>
  <p class="mb-2">
    <strong>{{data.page.name}}</strong>
    <span class="text-muted" i18n="print page tab hint|Explains that the tab row applies to this print only">
      — choose where the tab goes for this print only.
    </span>
  </p>

  <div fxLayout="row" fxLayoutGap="2rem" fxLayoutAlign="start start">
    <mat-radio-group class="rows" [(ngModel)]="selectedRow" aria-label="Tab position" i18n-aria-label="tab position|Tab position">
      <mat-radio-button *ngFor="let row of rows" class="row-option" [value]="row">
        <ng-container i18n="tab row|Tab row, followed by a number">Row</ng-container> {{row}}
        <span class="text-muted book-position" *ngIf="row === bookRow" i18n="book position|Marks the tab row the book uses">(book position)</span>
      </mat-radio-button>
    </mat-radio-group>

    <!-- A sketch of the page: grid plus the tab column with the chosen row filled in. -->
    <div class="sketch" aria-hidden="true">
      <div class="sketch-grid" [style.grid-template-columns]="'repeat(' + data.page.columns + ', 1fr)'"
           [style.grid-template-rows]="'repeat(' + data.page.rows + ', 1fr)'" [style.flex]="data.page.columns">
        <span class="sketch-cell" *ngFor="let cell of cells"></span>
      </div>
      <div class="sketch-tabs" [style.grid-template-rows]="'repeat(' + data.page.rows + ', 1fr)'">
        <span class="sketch-tab" *ngFor="let row of rows" [class.filled]="row === selectedRow"></span>
      </div>
    </div>
  </div>

  <mat-checkbox *ngIf="hasBackPage" class="mt-3 include-back-page" [(ngModel)]="includeBackPage"
                i18n="include back page|Include back page checkbox">Include back page</mat-checkbox>
</div>

<div mat-dialog-actions fxLayoutAlign="end center">
  <button mat-button [mat-dialog-close]="undefined" i18n="cancel|Cancel">Cancel</button>
  <button mat-raised-button color="primary" class="continue" (click)="continue()" i18n="continue|Continue">Continue</button>
</div>
